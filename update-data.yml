name: Update PyroScale Data & Forecasts

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Harmonization (NASA FIRMS Download)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python build_pyroscale_data.py --download --out pyroscale_data.json

      - name: Run Place Matching & City List Generation
        run: |
          python add_places.py --json pyroscale_data.json --places pyroscale_places.json

      - name: Run Machine Learning Forecasting
        run: |
          python forecast_pyroscale.py --data pyroscale_data.json --out pyroscale_forecast.json

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pyroscale_data.json pyroscale_places.json pyroscale_forecast.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update fire data, places, and forecasts [skip ci]" && git push)
